<body>
<label for="tipoMesa"><h2>Tipo de Mesa:</h2></label>
<select id="tipoMesa" name="tipoMesa" required>
  <option value="">Seleccione un tipo de mesa</option>
  <option value="interior">Interior</option>
  <option value="exterior">Exterior</option>
  <option value="vip">VIP</option>
</select>
<br><br>
<label for="nombreCompleto"><h2>Nombre Completo:</h2></label>
<input type="text" id="nombreCompleto" name="nombreCompleto" required placeholder="Ingrese su nombre completo">
<br><br>
<label for="fechaReserva"><h2>Fecha de Reserva:</h2></label>
<input type="date" id="fechaReserva" name="fechaReserva" required>
<br><br>
<label for="cantidadPersonas"><h2>Cantidad de Personas:</h2></label>
<input type="number" id="cantidadPersonas" name="cantidadPersonas" required placeholder="Ingrese la cantidad de personas">
<br><br>
<button type="submit" class="button is-primary" id="buttonReserva"><h2>Realizar Reserva</h2></button>
<a href="../index.html" class="button is-light"><h2>Regresar</h2></a>
<script src="../js/Reservas.js"></script>
</body>
