<body>
<label for="nombreProducto"><h2>Nombre del Producto:</h2></label>
<input type="text" id="nombreProducto" name="nombreProducto" required placeholder="Ingrese el nombre del producto">
<br><br>
<label for="direccion"><h2>Dirección Completa:</h2></label>
<input type="text" id="direccion" name="direccion" required placeholder="Ingrese la dirección completa">
<br><br>
<label for="nombreUsuario"><h2>Nombre del Usuario:</h2></label>
<input type="text" id="nombreUsuario" name="nombreUsuario" required placeholder="Ingrese el nombre del usuario">
<br><br>
<label for="cantidad"><h2>Cantidad de Productos:</h2></label>
<input type="number" id="cantidad" name="cantidad" required placeholder="Ingrese la cantidad de productos">
<br><br>
<label for="metodoPago"><h2>Método de Pago:</h2></label>
<select id="metodoPago" name="metodoPago" required>
  <option value="">Seleccione un método de pago</option>
  <option value="efectivo">Efectivo</option>
  <option value="tarjeta">Tarjeta de Crédito/Débito</option>
</select>
<br><br>
<label for="telefono"><h2>Teléfono:</h2></label>
<input type="tel" id="telefono" name="telefono" required placeholder="Ingrese su número de teléfono">
<br><br>
<button type="submit" class="button is-primary" id="buttonPedido"><h2>Realizar Pedido</h2></button>
<a href="../index.html" class="button is-light"><h2>Cancelar pedido</h2></a>
<script src="../js/Pedidos.js"></script>
</body>
