<body>
<label for="nombre"><h2>Nombre:</h2></label>
<input type="text" id="nombre" name="nombre" required placeholder="Ingrese su nombre">
<br><br>
<label for="apellido"><h2>Apellido:</h2></label>
<input type="text" id="apellido" name="apellido" required placeholder="Ingrese su apellido">
<br><br>
<label for="tipoDocumento"><h2>Tipo de Documento:</h2></label>
<select id="tipoDocumento" name="tipoDocumento" required>
  <option value="cedula">Cédula de Ciudadanía</option>
  <option value="tarjetaIdentidad">Tarjeta de Identidad</option>
  <option value="cedulaExtranjeria">Cédula de Extranjería</option>
  <option value="pasaporte">Pasaporte</option>
</select>
<br><br>
<label for="numeroDocumento"><h2>Numero de Documento:</h2></label>
<input type="text" id="numeroDocumento" name="numeroDocumento" required placeholder="Ingrese su número de documento">
<br><br>
<label for="telefono"><h2>Teléfono:</h2></label>
<input type="tel" id="telefono" name="telefono" required placeholder="Ingrese su número de teléfono">
<br><br>
<label for="correo"><h2>Correo Electrónico:</h2></label>
<input type="email" id="correo" name="correo" required placeholder="Ingrese su correo electrónico">
<br><br>
<label for="genero"><h2>Género:</h2></label>
<select id="genero" name="genero" required>
  <option value="">Seleccione su género</option>
  <option value="masculino">Masculino</option>
  <option value="femenino">Femenino</option>
  <option value="otro">Otro</option>
</select>
<br><br>
<label for="cargo"><h2>Cargo:</h2></label>
<select id="cargo" name="cargo" required>
  <option value="">Seleccione un cargo</option>
  <option value="cliente">Cliente</option>
</select>
<br><br>
<label for="fechaNacimiento"><h2>Fecha de Nacimiento:</h2></label>
<input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
<br><br>
<label for="contraseña"><h2>Contraseña:</h2></label>
<input type="password" id="contraseña" name="contraseña" required placeholder="Ingrese su contraseña">
<br><br>
<button type="submit" class="button is-primary" id="buttonUsuario"><h2>Registrar Usuario</h2></button>
<a href="../index.html" class="button is-light"><h2>Cancelar registro</h2></a>
<script src="../js/Usuarios.js"></script>
</body>
