<head>
<link rel="stylesheet" href="../css/Pedidos.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>

<body>
<label class="field"><h2>Nombre del Producto:</h2></label>
<input class="input" type="text" id="nombreProducto" name="nombreProducto" required placeholder="Ingrese el nombre del producto">
<br><br>
<label class="field"><h2>Dirección Completa:</h2></label>
<input class="input" type="text" id="direccion" name="direccion" required placeholder="Ingrese la dirección completa">
<br><br>
<label class="field"><h2>Nombre del Usuario:</h2></label>
<input class="input" type="text" id="nombreUsuario" name="nombreUsuario" required placeholder="Ingrese el nombre del usuario">
<br><br>
<label class="field"><h2>Cantidad de Productos:</h2></label>
<input class="input" type="number" id="cantidad" name="cantidad" required placeholder="Ingrese la cantidad de productos">
<br><br>
<label class="label"><h2>Método de Pago:</h2></label>
<div class="control">
  <div class="select">
<select id="metodoPago" name="metodoPago" required>
  <option value="">Seleccione un método de pago</option>
  <option value="efectivo">Efectivo</option>
  <option value="tarjeta">Tarjeta de Crédito/Débito</option>
</select>
</div>
</div>
<br><br>
<label class="field"><h2>Teléfono:</h2></label>
<input class="input" type="tel" id="telefono" name="telefono" required placeholder="Ingrese su número de teléfono">
<br><br>
<button type="submit" class="button is-primary" id="buttonPedido"><h2>Realizar Pedido</h2></button>
<a href="../index.html" class="button is-light"><h2>Cancelar pedido</h2></a>
<script src="../js/Pedidos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
