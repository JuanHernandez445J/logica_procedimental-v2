<head>
<link rel="stylesheet" href="../css/Inventario.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
<div class="field">
  <label class="label"><h2>Categoria:</h2></label>
  <div class="control">
    <div class="select">
      <select id="categoria" name="categoria" required>
        <option value="">Seleccione una categoria</option>
        <option value="Alimentos">Alimentos</option>
        <option value="Bebidas">Bebidas</option>
        <option value="Utensilios">Utensilios</option>
        <option value="Otros">Otros</option>
      </select>
    </div>
  </div>
</div>
<br><br>
  <label class="field"><h2>Código del Producto:</h2></label>
  <br>
    <input class="input" type="input" id="codigo" type="text" required placeholder="Ingrese el código del producto">
  </div>
</div>
<br><br>
<div class="field">
  <label class="label"><h2>Nombre del Producto:</h2></label>
  <div class="control">
    <input class="input" id="nombre" type="text" required placeholder="Ingrese el nombre del producto">
  </div>
</div>
<br><br>
<div class="field">
  <label class="label"><h2>Descripción del Producto:</h2></label>
  <div class="control">
    <textarea class="textarea" id="descripcion" required placeholder="Ingrese una descripción del producto"></textarea>
  </div>
</div>
<br><br>
<div class="field">
    <label class="label"><h2>Cantidad de Productos:</h2></label>
    <div class="control">
        <input class="input" id="cantidad" type="number" required placeholder="Ingrese la cantidad de productos">
    </div>
</div>
<br><br>
<div class="field">
    <label class="label"><h2>Precio Unitario:</h2></label>
    <div class="control">
        <input class="input" id="precio" type="number" required placeholder="Ingrese el precio unitario del producto">
    </div>
</div>
<br><br>
<div class="field">
    <label class="label"><h2>Proveedor:</h2></label>
    <div class="control">
        <input class="input" id="proveedor" type="text" required placeholder="Ingrese el nombre del proveedor">
    </div>
</div>
<br><br>
<div class="field is-grouped">
    <div class="control">
        <button class="button is-link" id="buttoninventory"><h2>Registrar Producto</h2></button>
        <a href="../index.html" class="button is-light"><h2>Cancelar</h2></a>
        <script src="../js/Inventario.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
