<head>
<link rel="stylesheet" href="../css/Usuarios.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>

<body>
<label class="field"><h2>Nombre:</h2></label>
<input class="input" type="text" id="nombre" name="nombre" required placeholder="Ingrese su nombre">
<br><br>
<label class="field"><h2>Apellido:</h2></label>
<input class="input" type="text" id="apellido" name="apellido" required placeholder="Ingrese su apellido">
<br><br>
<label class="label"><h2>Tipo de Documento:</h2></label>
<div class="control">
  <div class="select">
<select id="tipoDocumento" name="tipoDocumento" required>
  <option value="cedula">Cédula de Ciudadanía</option>
  <option value="tarjetaIdentidad">Tarjeta de Identidad</option>
  <option value="cedulaExtranjeria">Cédula de Extranjería</option>
  <option value="pasaporte">Pasaporte</option>
</select>
</div>
</div>
<br><br>
<label class="field"><h2>Numero de Documento:</h2></label>
<input class="input" type="text" id="numeroDocumento" name="numeroDocumento" required placeholder="Ingrese su número de documento">
<br><br>
<label class="field"><h2>Teléfono:</h2></label>
<input class="input" type="tel" id="telefono" name="telefono" required placeholder="Ingrese su número de teléfono">
<br><br>
<label class="field"><h2>Correo Electrónico:</h2></label>
<input class="input" type="email" id="correo" name="correo" required placeholder="Ingrese su correo electrónico">
<br><br>
<label class="label"><h2>Género:</h2></label>
<div class="control">
  <div class="select">
<select id="genero" name="genero" required>
  <option value="">Seleccione su género</option>
  <option value="masculino">Masculino</option>
  <option value="femenino">Femenino</option>
  <option value="otro">Otro</option>
</select>
</div>
</div>
<br><br>
<label class="label"><h2>Cargo:</h2></label>
<div class="control">
  <div class="select">
<select id="cargo" name="cargo" required>
  <option value="">Seleccione un cargo</option>
  <option value="cliente">Cliente</option>
</select>
</div>
</div>
<br><br>
<label class="field"><h2>Fecha de Nacimiento:</h2></label>
<input class="input" type="date" id="fechaNacimiento" name="fechaNacimiento" required>
<br><br>
<label class="field"><h2>Contraseña:</h2></label>
<input class="input" type="password" id="contraseña" name="contraseña" required placeholder="Ingrese su contraseña">
<br><br>
<button type="submit" class="button is-primary" id="buttonUsuario"><h2>Registrar Usuario</h2></button>
<a href="../index.html" class="button is-light"><h2>Cancelar registro</h2></a>
<script src="../js/Usuarios.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
