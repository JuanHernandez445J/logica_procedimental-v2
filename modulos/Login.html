<head>
<link rel="stylesheet" href="../css/Login.css">

<body>
<label class ="label"><h2>Tipo documento</h2></label>
<div class ="control">
  <div class ="select">
        <select id="tipoDocumento" name="tipoDocumento" required>
        <option value="cedula">Cédula de Ciudadanía</option>
        <option value="tarjetaIdentidad">Tarjeta de Identidad</option>
        <option value="cedulaExtranjeria">Cédula de Extranjería</option>
        <option value="pasaporte">Pasaporte</option>
</select>
</div>
</div>
<br><br>
  <div class="field">
    <label class="label"><h2>Numero de Documento:</h2></label>
  <div class ="control">
<input class="input" type="text" id="numeroDocumento" name="numeroDocumento" required placeholder="Ingrese su número de documento">
  </div>
  </div>
<br><br>
<label class="field"><h2>Contraseña:</h2></label>
<input class="input" type="password" id="contraseña" name="contraseña" required placeholder="Ingrese su contraseña">
<br><br>
<button type="submit" class="button is-primary" id="buttonlogin"><h2>Iniciar Sesión</h2></button>
<a href="../index.html" class="button is-link"><h2>Regresar</h2></a>
<script src="../js/Login.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
